[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "factotum-vn-nlp"
version = "0.1.0"
description = "Khôi phục tiếng Việt gõ nhanh (không dấu, viết tắt, thiếu từ, lỗi chính tả, Telex) thành câu chuẩn; chạy nhanh, offline và tự học từ chính tài liệu của bạn."
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["factotum*"]

[tool.setuptools.package-data]
"factotum.builder" = ["native/*.dll", "native/*.so", "native/*.dylib", "native/*.cpp"]
