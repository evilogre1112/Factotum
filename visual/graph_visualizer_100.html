  <style>
    html, body {
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
    }
    canvas {
      display: block;
      cursor: grab;
    }
    canvas.dragging-node {
      cursor: grabbing;
    }
    canvas.panning {
      cursor: grabbing;
    }
  </style>
</head>
<body class="bg-[var(--background)] text-[var(--foreground)] antialiased flex flex-col h-screen select-none">
  <!-- Top Bar -->
  <header class="flex flex-wrap items-center justify-between gap-2.5 px-4 py-2.5 bg-[var(--card)] border-b border-[var(--border)] z-10">
    <div>
      <h1 class="text-sm font-bold leading-tight">Đồ Thị Tri Thức Cụm Tối Đại &amp; Markov — 100 Nodes (Vật Lý Thời Gian Thực)</h1>
      <p class="text-xs text-[var(--muted-foreground)]">
        100 đỉnh cốt lõi · <span id="stat-edges" class="font-mono">298</span> cạnh có hướng · Kéo trực tiếp bất kỳ node nào để xem lực đàn hồi
      </p>
    </div>

    <div class="flex flex-wrap items-center gap-2 text-xs">
      <!-- Search -->
      <div class="relative">
        <input
          id="search-input"
          type="text"
          placeholder="Tìm node (vd: hợp đồng, nhà thầu...)"
          class="w-48 px-2.5 py-1.5 rounded-md bg-[var(--background)] border border-[var(--border)] text-[var(--foreground)] placeholder-[var(--muted-foreground)] focus:outline-none focus:ring-1 focus:ring-[var(--primary)]"
        />
        <div
          id="search-dropdown"
          class="hidden absolute left-0 right-0 mt-1 max-h-52 overflow-y-auto rounded-md bg-[var(--card)] border border-[var(--border)] shadow-lg z-30"
        ></div>
      </div>

      <!-- Color Mode -->
      <select
        id="color-mode"
        class="px-2 py-1.5 rounded-md bg-[var(--background)] border border-[var(--border)] text-[var(--foreground)] focus:outline-none"
      >
        <option value="comm">Màu theo Cụm cộng đồng</option>
        <option value="ngram">Màu theo N-gram (1 / 2 / 3)</option>
      </select>

      <!-- Spacing / Repulsion Slider -->
      <label class="flex items-center gap-1.5 px-2.5 py-1 rounded-md bg-[var(--background)] border border-[var(--border)]">
        <span class="text-[var(--muted-foreground)]">Độ giãn</span>
        <input id="repulsion-slider" type="range" min="100" max="420" value="230" step="10" class="w-20 accent-[var(--primary)]" />
      </label>

      <!-- Physics Toggle -->
      <button
        id="btn-physics"
        class="px-2.5 py-1.5 rounded-md bg-[var(--background)] border border-[var(--border)] font-medium hover:border-[var(--primary)] transition"
      >
        ⏸ Tạm dừng vật lý
      </button>

      <!-- Reset View -->
      <button
        id="btn-reset"
        class="px-2.5 py-1.5 rounded-md bg-[var(--primary)] text-[var(--primary-foreground)] font-medium hover:opacity-90 transition"
      >
        Đặt lại góc nhìn
      </button>
    </div>
  </header>

  <!-- Main Workspace -->
  <div class="flex flex-1 min-h-0 overflow-hidden relative">
    <!-- Canvas -->
    <div id="canvas-wrap" class="flex-1 relative min-w-0 h-full overflow-hidden">
      <canvas id="graph-canvas" class="w-full h-full"></canvas>

      <!-- Floating Legend -->
      <div
        id="legend"
        class="absolute bottom-3 left-3 px-3 py-2 rounded-lg bg-[var(--card)]/95 border border-[var(--border)] shadow-sm text-xs space-y-1 max-w-sm"
      ></div>

      <!-- Zoom controls -->
      <div class="absolute bottom-3 right-3 flex flex-col gap-1">
        <button id="btn-zoom-in" class="w-8 h-8 rounded-md bg-[var(--card)] border border-[var(--border)] font-bold text-sm hover:opacity-80">+</button>
        <button id="btn-zoom-out" class="w-8 h-8 rounded-md bg-[var(--card)] border border-[var(--border)] font-bold text-sm hover:opacity-80">−</button>
      </div>
    </div>

    <!-- Right Inspector Sidebar -->
    <aside class="w-76 shrink-0 bg-[var(--card)] border-l border-[var(--border)] flex flex-col h-full overflow-hidden" style="width: 300px;">
      <div class="p-3 border-b border-[var(--border)]">
        <div class="text-xs font-semibold uppercase tracking-wide text-[var(--muted-foreground)] mb-1.5">
          Đỉnh trung tâm (Hubs)
        </div>
        <div id="quick-hubs" class="flex flex-wrap gap-1.5"></div>
      </div>

      <div id="inspector-body" class="flex-1 overflow-y-auto p-3 space-y-3 text-xs"></div>
    </aside>
  </div>

    const wrap = document.getElementById("canvas-wrap");
    const legendEl = document.getElementById("legend");
    const inspectorBody = document.getElementById("inspector-body");

    function getThemeColors() {
      const cs = getComputedStyle(document.documentElement);
      const isLight = document.documentElement.classList.contains("light");
      return {
        fg: cs.getPropertyValue("--foreground").trim() || (isLight ? "#0f172a" : "#f8fafc"),
        muted: cs.getPropertyValue("--muted-foreground").trim() || (isLight ? "#64748b" : "#94a3b8"),
        edgeBase: isLight ? "rgba(100,116,139,0.26)" : "rgba(148,163,184,0.24)",
        edgeDim: isLight ? "rgba(100,116,139,0.05)" : "rgba(148,163,184,0.05)",
        outEdge: "#f59e0b",
        inEdge: "#06b6d4",
        labelBg: isLight ? "rgba(255,255,255,0.88)" : "rgba(15,23,42,0.82)",
        nodeRing: isLight ? "#ffffff" : "#0f172a"
      };
    }

    function getNodeColor(n) {
      if (colorMode === "comm") return PALETTE_COMM[n.comm % PALETTE_COMM.length];
      return PALETTE_NGRAM[Math.min(2, n.ngram - 1)];
    }

    function worldToScreen(wx, wy) {
      return [canvas.clientWidth / 2 + (wx - camX) * camScale, canvas.clientHeight / 2 + (wy - camY) * camScale];
    }

    function screenToWorld(sx, sy) {
      return [(sx - canvas.clientWidth / 2) / camScale + camX, (sy - canvas.clientHeight / 2) / camScale + camY];
    }

    function stepPhysics() {
      if (!physicsRunning) return;

      const N = nodes.length;
      const repConst = repulsionScale * 140; // strong repulsion so nodes stay well-separated
      const springLen = repulsionScale * 0.92;
      const springK = 0.016;
      const centerGravity = 0.0022;
      const damping = 0.84;

      // 1. Pairwise Coulomb repulsion + soft collision spacing
      for (let i = 0; i < N; i++) {
        const a = nodes[i];
        for (let j = i + 1; j < N; j++) {
          const b = nodes[j];
          let dx = b.x - a.x;
          let dy = b.y - a.y;
          let distSq = dx * dx + dy * dy;
          if (distSq < 1) {
            dx = (Math.random() - 0.5) * 2;
            dy = (Math.random() - 0.5) * 2;
            distSq = dx * dx + dy * dy;
          }
          const dist = Math.sqrt(distSq);
          const ux = dx / dist;
          const uy = dy / dist;

          // Repulsion force
          let f = repConst / (distSq + 600);

          // Extra soft collision padding so labels never overlap
          const minSep = a.r + b.r + repulsionScale * 0.34;
          if (dist < minSep) {
            f += (minSep - dist) * 0.14;
          }

          const fx = ux * f;
          const fy = uy * f;
          a.vx -= fx;
          a.vy -= fy;
          b.vx += fx;
          b.vy += fy;
        }
      }

      // 2. Hooke spring attraction along directed Markov edges
      for (let i = 0; i < edges.length; i++) {
        const e = edges[i];
        const a = nodes[e.u];
        const b = nodes[e.v];
        const dx = b.x - a.x;
        const dy = b.y - a.y;
        const dist = Math.sqrt(dx * dx + dy * dy) || 1;
        const targetDist = springLen * (1.15 - Math.min(0.45, e.prob * 0.7));
        const force = (dist - targetDist) * springK * (0.65 + e.prob * 1.4);
        const fx = (dx / dist) * force;
        const fy = (dy / dist) * force;
        a.vx += fx;
        a.vy += fy;
        b.vx -= fx;
        b.vy -= fy;
      }

      // 3. Gentle center gravity + velocity integration
      for (let i = 0; i < N; i++) {
        const n = nodes[i];
        if (i === draggedNodeId) {
          n.vx = 0;
          n.vy = 0;
          continue;
        }
        n.vx -= n.x * centerGravity;
        n.vy -= n.y * centerGravity;
        n.vx *= damping;
        n.vy *= damping;

        const maxV = 18;
        const vMag = Math.hypot(n.vx, n.vy);
        if (vMag > maxV) {
          n.vx = (n.vx / vMag) * maxV;
          n.vy = (n.vy / vMag) * maxV;
        }
        n.x += n.vx;
        n.y += n.vy;
      }
    }

    function drawCurvedEdge(x1, y1, x2, y2, rTarget, color, lineWidth, showArrow, probLabel) {
      const dx = x2 - x1;
      const dy = y2 - y1;
      const dist = Math.hypot(dx, dy);
      if (dist < rTarget + 6) return;

      // Slight quadratic curve so bidirectional edges (A->B and B->A) don't overlap
      const mx = (x1 + x2) / 2;
      const my = (y1 + y2) / 2;
      const curveOffset = Math.min(26, dist * 0.12);
      const cx = mx - (dy / dist) * curveOffset;
      const cy = my + (dx / dist) * curveOffset;

      // End point near target node border
      const tdx = x2 - cx;
      const tdy = y2 - cy;
      const tdist = Math.hypot(tdx, tdy) || 1;
      const ex = x2 - (tdx / tdist) * (rTarget + 3);
      const ey = y2 - (tdy / tdist) * (rTarget + 3);

      ctx.strokeStyle = color;
      ctx.lineWidth = lineWidth;
      ctx.beginPath();
      ctx.moveTo(x1, y1);
      ctx.quadraticCurveTo(cx, cy, ex, ey);
      ctx.stroke();

      if (showArrow) {
        const headLen = Math.min(11, Math.max(5.5, lineWidth * 3.4));
        const angle = Math.atan2(tdy, tdx);
        ctx.fillStyle = color;
        ctx.beginPath();
        ctx.moveTo(ex, ey);
        ctx.lineTo(ex - headLen * Math.cos(angle - Math.PI / 6), ey - headLen * Math.sin(angle - Math.PI / 6));
        ctx.lineTo(ex - headLen * Math.cos(angle + Math.PI / 6), ey - headLen * Math.sin(angle + Math.PI / 6));
        ctx.closePath();
        ctx.fill();
      }

      if (probLabel) {
        const lx = 0.25 * x1 + 0.5 * cx + 0.25 * ex;
        const ly = 0.25 * y1 + 0.5 * cy + 0.25 * ey;
        ctx.font = "600 10px ui-monospace, monospace";
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        const tw = ctx.measureText(probLabel).width;
        ctx.fillStyle = getThemeColors().labelBg;
        ctx.fillRect(lx - tw / 2 - 3, ly - 7, tw + 6, 14);
        ctx.fillStyle = color;
        ctx.fillText(probLabel, lx, ly);
      }
    }

    function draw() {
      const w = canvas.clientWidth;
      const h = canvas.clientHeight;
      const theme = getThemeColors();
      ctx.clearRect(0, 0, w, h);

      const activeId = selectedId !== -1 ? selectedId : hoverId;
      const activeNode = activeId !== -1 ? nodes[activeId] : null;

      const sx = new Float32Array(nodes.length);
      const sy = new Float32Array(nodes.length);
      for (let i = 0; i < nodes.length; i++) {
        const p = worldToScreen(nodes[i].x, nodes[i].y);
        sx[i] = p[0];
        sy[i] = p[1];
      }

      // 1. Background edges
      for (let i = 0; i < edges.length; i++) {
        const e = edges[i];
        if (activeNode && (e.u === activeId || e.v === activeId)) continue;
        const radV = nodes[e.v].r * Math.max(0.55, Math.min(1.4, camScale));
        drawCurvedEdge(
          sx[e.u],
          sy[e.u],
          sx[e.v],
          sy[e.v],
          radV,
          activeNode ? theme.edgeDim : theme.edgeBase,
          activeNode ? 0.7 : 0.9 + e.prob * 1.4,
          !activeNode && camScale > 0.48,
          null
        );
      }

      // 2. Highlighted edges of active node
      if (activeNode) {
        for (const e of activeNode.inEdges) {
          const radV = nodes[e.v].r * Math.max(0.55, Math.min(1.4, camScale));
          drawCurvedEdge(
            sx[e.u],
            sy[e.u],
            sx[e.v],
            sy[e.v],
            radV,
            theme.inEdge,
            1.8 + e.prob * 2.5,
            true,
            `${(e.prob * 100).toFixed(0)}%`
          );
        }
        for (const e of activeNode.outEdges) {
          const radV = nodes[e.v].r * Math.max(0.55, Math.min(1.4, camScale));
          drawCurvedEdge(
            sx[e.u],
            sy[e.u],
            sx[e.v],
            sy[e.v],
            radV,
            theme.outEdge,
            1.8 + e.prob * 2.5,
            true,
            `${(e.prob * 100).toFixed(0)}%`
          );
        }
      }

      // 3. Draw nodes + always-clear labels
      const nodeScale = Math.max(0.55, Math.min(1.4, camScale));
      for (let i = 0; i < nodes.length; i++) {
        const n = nodes[i];
        const x = sx[i], y = sy[i];
        if (x < -80 || x > w + 80 || y < -80 || y > h + 80) continue;

        const isFocus = i === activeId;
        const isNeighbor = activeNode ? activeNode.neighbors.has(i) : false;
        const rad = n.r * nodeScale * (isFocus ? 1.22 : 1.0);

        ctx.globalAlpha = activeNode ? (isFocus || isNeighbor ? 1.0 : 0.18) : 0.94;
        ctx.fillStyle = getNodeColor(n);
        ctx.beginPath();
        ctx.arc(x, y, rad, 0, Math.PI * 2);
        ctx.fill();

        ctx.lineWidth = isFocus ? 2.8 : 1.5;
        ctx.strokeStyle = isFocus ? theme.fg : theme.nodeRing;
        ctx.stroke();

        // Label pill below/above node
        const fontSize = Math.round(Math.max(10.5, Math.min(14, 10 + n.r * 0.14 * nodeScale)));
        ctx.font = `${isFocus || n.freq > 20000 ? "700" : "500"} ${fontSize}px system-ui, -apple-system, sans-serif`;
        ctx.textAlign = "center";
        ctx.textBaseline = "top";
        const tw = ctx.measureText(n.label).width;
        const ly = y + rad + 4;
        ctx.fillStyle = theme.labelBg;
        ctx.fillRect(x - tw / 2 - 3, ly - 1, tw + 6, fontSize + 3);
        ctx.fillStyle = theme.fg;
        ctx.fillText(n.label, x, ly);
      }
      ctx.globalAlpha = 1.0;
    }

    function animate() {
      stepPhysics();
      draw();
      requestAnimationFrame(animate);
    }

    function hitTest(clientX, clientY) {
      const rect = canvas.getBoundingClientRect();
      const mx = clientX - rect.left;
      const my = clientY - rect.top;
      const nodeScale = Math.max(0.55, Math.min(1.4, camScale));
      let best = -1;
      let bestDist = Infinity;
      for (let i = 0; i < nodes.length; i++) {
        const [x, y] = worldToScreen(nodes[i].x, nodes[i].y);
        const rad = Math.max(10, nodes[i].r * nodeScale + 4);
        const d = Math.hypot(mx - x, my - y);
        if (d <= rad && d < bestDist) {
          bestDist = d;
          best = i;
        }
      }
      return best;
    }

    function renderLegend() {
      if (colorMode === "comm") {
        legendEl.innerHTML =
          `<div class="font-semibold mb-1">Cụm cộng đồng (100 đỉnh lõi)</div>` +
          `<div class="grid grid-cols-2 gap-x-3 gap-y-1">` +
          COMM_NAMES.map(
            (name, i) =>
              `<div class="flex items-center gap-1.5"><span class="w-2.5 h-2.5 rounded-full shrink-0" style="background:${PALETTE_COMM[i]}"></span><span class="truncate">${name}</span></div>`
          ).join("") +
          `</div>`;
      } else {
        legendEl.innerHTML =
          `<div class="font-semibold mb-1">Phân loại N-gram</div>` +
          `<div class="space-y-1">` +
          NGRAM_NAMES.map(
            (name, i) =>
              `<div class="flex items-center gap-1.5"><span class="w-2.5 h-2.5 rounded-full shrink-0" style="background:${PALETTE_NGRAM[i]}"></span><span>${name}</span></div>`
          ).join("") +
          `</div>`;
      }
    }

    function updateInspector() {
      if (selectedId === -1) {
        inspectorBody.innerHTML = `
          <div class="text-[var(--muted-foreground)] leading-relaxed space-y-2.5">
            <p class="font-semibold text-[var(--foreground)]">Tương tác Vật lý Thời gian thực</p>
            <ul class="list-disc pl-4 space-y-1">
              <li><b>Kéo trực tiếp 1 node</b> để thấy lực lò xo đàn hồi kéo theo các cụm từ liên quan.</li>
              <li><b>Kéo vùng trống</b> để di chuyển bản đồ, <b>cuộn chuột</b> để phóng to / thu nhỏ.</li>
              <li><b>Kéo thanh "Độ giãn"</b> ở trên để đẩy các node xa nhau hơn nữa.</li>
              <li><b>Click 1 node</b> để xem xác suất chuyển tiếp Markov đi ra (cam) và đi vào (xanh ngọc).</li>
            </ul>
          </div>`;
        return;
      }

      const n = nodes[selectedId];
      const outHtml = n.outEdges.length
        ? n.outEdges
            .map(
              (e) => `
            <button data-jump="${e.v}" class="w-full text-left p-1.5 rounded hover:bg-[var(--background)] border border-transparent hover:border-[var(--border)] transition flex items-center justify-between gap-2">
              <span class="truncate font-medium">→ ${nodes[e.v].label}</span>
              <span class="font-mono text-[var(--muted-foreground)] shrink-0">${(e.prob * 100).toFixed(1)}% (${e.freq.toLocaleString()})</span>
            </button>`
            )
            .join("")
        : `<div class="text-[var(--muted-foreground)] italic">Không có cạnh đi ra trong top 100 node.</div>`;

      const inHtml = n.inEdges.length
        ? n.inEdges
            .map(
              (e) => `
            <button data-jump="${e.u}" class="w-full text-left p-1.5 rounded hover:bg-[var(--background)] border border-transparent hover:border-[var(--border)] transition flex items-center justify-between gap-2">
              <span class="truncate font-medium">${nodes[e.u].label} →</span>
              <span class="font-mono text-[var(--muted-foreground)] shrink-0">${(e.prob * 100).toFixed(1)}% (${e.freq.toLocaleString()})</span>
            </button>`
            )
            .join("")
        : `<div class="text-[var(--muted-foreground)] italic">Không có cạnh đi vào trong top 100 node.</div>`;

      inspectorBody.innerHTML = `
        <div class="p-2.5 rounded-lg bg-[var(--background)] border border-[var(--border)] space-y-1.5">
          <div class="flex items-center justify-between gap-2">
            <span class="text-sm font-bold">${n.label}</span>
            <span class="px-1.5 py-0.5 rounded text-[11px] font-mono bg-[var(--card)] border border-[var(--border)]">${n.ngram}-gram</span>
          </div>
          <div class="grid grid-cols-2 gap-1 pt-1 text-[var(--muted-foreground)]">
            <div>Tần suất: <b class="text-[var(--foreground)] font-mono">${n.freq.toLocaleString()}</b></div>
            <div>Cụm: <b class="text-[var(--foreground)]">${COMM_NAMES[n.comm]}</b></div>
            <div>Cạnh ra: <b class="text-amber-500 font-mono">${n.outEdges.length}</b></div>
            <div>Cạnh vào: <b class="text-cyan-500 font-mono">${n.inEdges.length}</b></div>
          </div>
        </div>
        <div>
          <div class="font-semibold text-amber-500 mb-1">Cạnh Markov đi ra (A → B)</div>
          <div class="space-y-0.5">${outHtml}</div>
        </div>
        <div>
          <div class="font-semibold text-cyan-500 mb-1">Cạnh đi vào (X → A)</div>
          <div class="space-y-0.5">${inHtml}</div>
        </div>`;

      inspectorBody.querySelectorAll("[data-jump]").forEach((btn) => {
        btn.addEventListener("click", () => focusNode(Number(btn.dataset.jump)));
      });
    }

    function focusNode(id) {
      const n = nodes[id];
      if (!n) return;
      selectedId = id;
      camX = n.x;
      camY = n.y;
      camScale = Math.max(camScale, 0.95);
      updateInspector();
    }

    function resize() {
      const dpr = window.devicePixelRatio || 1;
      canvas.width = Math.max(1, Math.floor(wrap.clientWidth * dpr));
      canvas.height = Math.max(1, Math.floor(wrap.clientHeight * dpr));
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }

    function resetView() {
      camX = 0;
      camY = 0;
      const minDim = Math.min(wrap.clientWidth, wrap.clientHeight);
      camScale = Math.max(0.35, minDim / 1850);
      selectedId = -1;
      updateInspector();
    }

    // Quick Hub Chips
    const hubNames = ["nhà thầu", "hợp đồng", "quy định", "quy định tại", "trường hợp", "thực hiện", "yêu cầu", "đối với", "gói thầu", "công việc"];
    const quickHubsEl = document.getElementById("quick-hubs");
    hubNames.forEach((name) => {
      const found = nodes.find((n) => n.label === name);
      if (!found) return;
      const btn = document.createElement("button");
      btn.textContent = name;
      btn.className = "px-2 py-0.5 rounded-full text-xs bg-[var(--background)] border border-[var(--border)] hover:border-[var(--primary)] transition";
      btn.addEventListener("click", () => focusNode(found.id));
      quickHubsEl.appendChild(btn);
    });

    // Search
    const searchInput = document.getElementById("search-input");
    const searchDropdown = document.getElementById("search-dropdown");
    searchInput.addEventListener("input", () => {
      const q = searchInput.value.trim().toLowerCase();
      if (!q) {
        searchDropdown.classList.add("hidden");
        return;
      }
      const hits = nodes.filter((n) => n.label.includes(q)).slice(0, 12);
      searchDropdown.innerHTML = hits.length
        ? hits
            .map(
              (n) =>
                `<button data-id="${n.id}" class="w-full text-left px-2.5 py-1.5 hover:bg-[var(--background)] flex items-center justify-between gap-2">
                  <span class="truncate font-medium">${n.label}</span>
                  <span class="font-mono text-[var(--muted-foreground)]">${n.freq.toLocaleString()}</span>
                </button>`
            )
            .join("")
        : `<div class="p-2 text-[var(--muted-foreground)]">Không thấy trong top 100 node</div>`;
      searchDropdown.querySelectorAll("button").forEach((b) => {
        b.addEventListener("click", () => {
          focusNode(Number(b.dataset.id));
          searchDropdown.classList.add("hidden");
          searchInput.value = nodes[Number(b.dataset.id)].label;
        });
      });
      searchDropdown.classList.remove("hidden");
    });

    document.addEventListener("click", (e) => {
      if (!searchInput.contains(e.target) && !searchDropdown.contains(e.target)) {
        searchDropdown.classList.add("hidden");
      }
    });

    // Mouse interactions: Drag node OR Pan canvas
    canvas.addEventListener("mousedown", (e) => {
      pointerMoved = false;
      const hit = hitTest(e.clientX, e.clientY);
      if (hit !== -1) {
        draggedNodeId = hit;
        canvas.classList.add("dragging-node");
      } else {
        isPanning = true;
        panStartX = e.clientX;
        panStartY = e.clientY;
        panCamX = camX;
        panCamY = camY;
        canvas.classList.add("panning");
      }
    });

    window.addEventListener("mousemove", (e) => {
      if (draggedNodeId !== -1) {
        pointerMoved = true;
        const rect = canvas.getBoundingClientRect();
        const [wx, wy] = screenToWorld(e.clientX - rect.left, e.clientY - rect.top);
        nodes[draggedNodeId].x = wx;
        nodes[draggedNodeId].y = wy;
        nodes[draggedNodeId].vx = 0;
        nodes[draggedNodeId].vy = 0;
        return;
      }
      if (isPanning) {
        const dx = e.clientX - panStartX;
        const dy = e.clientY - panStartY;
        if (Math.hypot(dx, dy) > 3) pointerMoved = true;
        camX = panCamX - dx / camScale;
        camY = panCamY - dy / camScale;
        return;
      }
      if (e.target === canvas) {
        hoverId = hitTest(e.clientX, e.clientY);
      } else {
        hoverId = -1;
      }
    });

    window.addEventListener("mouseup", (e) => {
      if (draggedNodeId !== -1) {
        if (!pointerMoved) {
          selectedId = draggedNodeId;
          updateInspector();
        }
        draggedNodeId = -1;
        canvas.classList.remove("dragging-node");
      } else if (isPanning) {
        if (!pointerMoved && e.target === canvas) {
          selectedId = -1;
          updateInspector();
        }
        isPanning = false;
        canvas.classList.remove("panning");
      }
    });

    canvas.addEventListener(
      "wheel",
      (e) => {
        e.preventDefault();
        const rect = canvas.getBoundingClientRect();
        const mx = e.clientX - rect.left;
        const my = e.clientY - rect.top;
        const [wxBefore, wyBefore] = screenToWorld(mx, my);
        const factor = e.deltaY < 0 ? 1.15 : 1 / 1.15;
        camScale = Math.min(3.5, Math.max(0.18, camScale * factor));
        const [wxAfter, wyAfter] = screenToWorld(mx, my);
        camX += wxBefore - wxAfter;
        camY += wyBefore - wyAfter;
      },
      { passive: false }
    );

    // Controls
    document.getElementById("color-mode").addEventListener("change", (e) => {
      colorMode = e.target.value;
      renderLegend();
    });
    document.getElementById("repulsion-slider").addEventListener("input", (e) => {
      repulsionScale = Number(e.target.value);
    });
    const btnPhysics = document.getElementById("btn-physics");
    btnPhysics.addEventListener("click", () => {
      physicsRunning = !physicsRunning;
      btnPhysics.textContent = physicsRunning ? "⏸ Tạm dừng vật lý" : "▶ Chạy vật lý";
    });
    document.getElementById("btn-reset").addEventListener("click", resetView);
    document.getElementById("btn-zoom-in").addEventListener("click", () => {
      camScale = Math.min(3.5, camScale * 1.25);
    });
    document.getElementById("btn-zoom-out").addEventListener("click", () => {
      camScale = Math.max(0.18, camScale / 1.25);
    });

    window.addEventListener("resize", resize);
    window.addEventListener("themechange", draw);

    renderLegend();
    resize();
    resetView();
    requestAnimationFrame(animate);
  </script>
</body>
</html>
