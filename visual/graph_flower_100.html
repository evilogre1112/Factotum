    function getTheme() {
      const cs = getComputedStyle(document.documentElement);
      const isLight = document.documentElement.classList.contains("light");
      return {
        fg: cs.getPropertyValue("--foreground").trim() || (isLight ? "#0f172a" : "#f8fafc"),

    }

    function screenToWorld(sx, sy) {
      return [(sx - canvas.clientWidth / 2) / camScale + camX, (sy - canvas.clientHeight / 2) / camScale + camY];
    }

    function stepPhysics() {
      if (!physicsRunning) return;
      const N = nodes.length;
      const damping = 0.85;

      // 1. Soft spring tether to blooming flower target position
      for (let i = 0; i < N; i++) {
        const n = nodes[i];
        if (i === draggedId) {
          n.vx = 0;
          n.vy = 0;
          continue;
        }
        const tx = n.ax * bloomScale;
        const ty = n.ay * bloomScale;
        const kHome = n.isHub === 2 ? 0.08 : n.isHub === 1 ? 0.035 : 0.025;
        n.vx += (tx - n.x) * kHome;
        n.vy += (ty - n.y) * kHome;
      }

      // 2. Elastic springs along edges (so pulling a hub pulls its whole petal!)
      for (let i = 0; i < edges.length; i++) {
        const e = edges[i];
        const a = nodes[e.u], b = nodes[e.v];
        const dx = b.x - a.x, dy = b.y - a.y;
        const dist = Math.hypot(dx, dy) || 1;
        const rest = Math.hypot((b.ax - a.ax) * bloomScale, (b.ay - a.ay) * bloomScale);
        const f = (dist - rest) * 0.045;
        const fx = (dx / dist) * f, fy = (dy / dist) * f;
        if (e.u !== draggedId) { a.vx += fx; a.vy += fy; }
        if (e.v !== draggedId) { b.vx -= fx; b.vy -= fy; }
      }

      // 3. Soft collision avoidance between leaves
      for (let i = 0; i < N; i++) {
        const a = nodes[i];
        for (let j = i + 1; j < N; j++) {
          const b = nodes[j];
          const dx = b.x - a.x, dy = b.y - a.y;
          const dist = Math.hypot(dx, dy) || 0.1;
          const minSep = a.r + b.r + 36;
          if (dist < minSep) {
            const push = (minSep - dist) * 0.08;
            const fx = (dx / dist) * push, fy = (dy / dist) * push;
            if (i !== draggedId) { a.vx -= fx; a.vy -= fy; }
            if (j !== draggedId) { b.vx += fx; b.vy += fy; }
          }
        }
      }

      // 4. Integrate
      for (let i = 0; i < N; i++) {
        const n = nodes[i];
        if (i === draggedId) continue;
        n.vx *= damping;
        n.vy *= damping;
        n.x += n.vx;
        n.y += n.vy;
      }
    }

    function draw() {
      const w = canvas.clientWidth, h = canvas.clientHeight;
      const theme = getTheme();
      ctx.clearRect(0, 0, w, h);

      const activeId = selectedId !== -1 ? selectedId : hoverId;
      const activeNode = activeId !== -1 ? nodes[activeId] : null;
      const nodeScale = Math.max(0.45, Math.min(1.4, camScale));

      // 1. Soft translucent petal halos behind each domain hub
      for (let p = 1; p <= 6; p++) {
        const hub = nodes.find((n) => n.petal === p && n.isHub === 1);
        if (!hub) continue;
        const [hx, hy] = worldToScreen(hub.x * 1.9, hub.y * 1.9);
        const grad = ctx.createRadialGradient(hx, hy, 10 * camScale, hx, hy, 280 * camScale * bloomScale);
        const col = PETAL_META[p].color;
        grad.addColorStop(0, col + "22");
        grad.addColorStop(1, col + "00");
        ctx.fillStyle = grad;
        ctx.beginPath();
        ctx.arc(hx, hy, 280 * camScale * bloomScale, 0, Math.PI * 2);
        ctx.fill();
      }

      // 2. Draw organic curved stems (edges)
      for (let i = 0; i < edges.length; i++) {
        const e = edges[i];
        const a = nodes[e.u], b = nodes[e.v];
        const [x1, y1] = worldToScreen(a.x, a.y);
        const [x2, y2] = worldToScreen(b.x, b.y);
        const col = PETAL_META[b.petal].color;
        const isHi = activeNode && (e.u === activeId || e.v === activeId || (activeNode.isHub === 1 && b.petal === activeNode.petal));

        ctx.globalAlpha = activeNode ? (isHi ? 0.92 : 0.12) : (a.isHub === 2 ? 0.72 : 0.45);
        ctx.strokeStyle = col;
        ctx.lineWidth = a.isHub === 2 ? 3.2 * nodeScale : (isHi ? 2.4 : 1.4) * nodeScale;

        const mx = (x1 + x2) / 2, my = (y1 + y2) / 2;
        const dx = x2 - x1, dy = y2 - y1;
        const dist = Math.hypot(dx, dy) || 1;
        const cx = mx - (dy / dist) * Math.min(28, dist * 0.1);
        const cy = my + (dx / dist) * Math.min(28, dist * 0.1);

        ctx.beginPath();
        ctx.moveTo(x1, y1);
        ctx.quadraticCurveTo(cx, cy, x2, y2);
        ctx.stroke();
      }
      ctx.globalAlpha = 1.0;

      // 3. Draw nodes + crisp labels
      for (let i = 0; i < nodes.length; i++) {
        const n = nodes[i];
        const [x, y] = worldToScreen(n.x, n.y);
        const col = PETAL_META[n.petal].color;
        const isFocus = i === activeId;
        const isRel = activeNode && (isFocus || activeNode.neighbors.has(i) || (activeNode.isHub === 1 && n.petal === activeNode.petal));
        const rad = n.r * nodeScale * (isFocus ? 1.2 : 1.0);

        ctx.globalAlpha = activeNode ? (isRel ? 1.0 : 0.18) : 0.96;

        // Glow for center & petal hubs
        if (n.isHub > 0) {
          ctx.shadowColor = col;
          ctx.shadowBlur = n.isHub === 2 ? 22 : 12;
        }
        ctx.fillStyle = col;
        ctx.beginPath();
        ctx.arc(x, y, rad, 0, Math.PI * 2);
        ctx.fill();
        ctx.shadowBlur = 0;

        ctx.lineWidth = isFocus ? 2.6 : (n.isHub > 0 ? 2.2 : 1.2);
        ctx.strokeStyle = isFocus ? theme.fg : theme.ring;
        ctx.stroke();

        // Label
        const fontSize = n.isHub === 2 ? 14 : n.isHub === 1 ? 13 : Math.max(10, Math.min(12.5, 11 * nodeScale + 1));
        ctx.font = `${n.isHub > 0 || isFocus ? "700" : "500"} ${Math.round(fontSize)}px system-ui, -apple-system, sans-serif`;
        ctx.textAlign = "center";
        ctx.textBaseline = "top";
        const tw = ctx.measureText(n.label).width;
        const ly = y + rad + 4;
        ctx.fillStyle = theme.labelBg;
        ctx.fillRect(x - tw / 2 - 3, ly - 1, tw + 6, fontSize + 3);
        ctx.fillStyle = theme.fg;
        ctx.fillText(n.label, x, ly);
      }
      ctx.globalAlpha = 1.0;
    }

    function animate() {
      stepPhysics();
      draw();
      requestAnimationFrame(animate);
    }

    function hitTest(clientX, clientY) {
      const rect = canvas.getBoundingClientRect();
      const mx = clientX - rect.left, my = clientY - rect.top;
      const nodeScale = Math.max(0.45, Math.min(1.4, camScale));
      for (let i = nodes.length - 1; i >= 0; i--) {
        const [x, y] = worldToScreen(nodes[i].x, nodes[i].y);
        if (Math.hypot(mx - x, my - y) <= Math.max(11, nodes[i].r * nodeScale + 5)) return i;
      }
      return -1;
    }

    function updateInfoCard() {
      if (selectedId === -1) {
        infoCard.classList.add("hidden");
        return;
      }
      const n = nodes[selectedId];
      const meta = PETAL_META[n.petal];
      infoCard.innerHTML = `
        <div class="flex items-center justify-between gap-2">
          <span class="font-bold text-sm">${n.label}</span>
          <span class="px-1.5 py-0.5 rounded font-mono bg-[var(--background)] border border-[var(--border)]">${n.ngram}-gram</span>
        </div>
        <div class="text-[var(--muted-foreground)]">Nhánh: <b style="color:${meta.color}">${meta.name}</b></div>
        <div class="text-[var(--muted-foreground)]">Tần suất trong KnowledgeBase: <b class="text-[var(--foreground)] font-mono">${n.freq.toLocaleString()}</b></div>
      `;
      infoCard.classList.remove("hidden");
    }

    function resize() {
      const dpr = window.devicePixelRatio || 1;
      canvas.width = Math.max(1, Math.floor(wrap.clientWidth * dpr));
      canvas.height = Math.max(1, Math.floor(wrap.clientHeight * dpr));
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }

    function resetView() {
      camX = 0; camY = 0;
      const minDim = Math.min(wrap.clientWidth, wrap.clientHeight);
      camScale = Math.max(0.32, minDim / 1450);
      selectedId = -1;
      updateInfoCard();
    }

    legendEl.innerHTML =
      `<div class="font-semibold mb-1">6 Cánh Hoa Lĩnh Vực Pháp Luật</div>` +
      PETAL_META.map(
        (m) => `<div class="flex items-center gap-2"><span class="w-2.5 h-2.5 rounded-full shrink-0" style="background:${m.color}"></span><span>${m.name}</span></div>`
      ).join("");

    canvas.addEventListener("mousedown", (e) => {
      pointerMoved = false;
      const hit = hitTest(e.clientX, e.clientY);
      if (hit !== -1) {
        draggedId = hit;
        canvas.classList.add("dragging");
      } else {
        isPanning = true;
        panStartX = e.clientX; panStartY = e.clientY;
        panCamX = camX; panCamY = camY;
        canvas.classList.add("dragging");
      }
    });

    window.addEventListener("mousemove", (e) => {
      if (draggedId !== -1) {
        pointerMoved = true;
        const rect = canvas.getBoundingClientRect();
        const [wx, wy] = screenToWorld(e.clientX - rect.left, e.clientY - rect.top);
        nodes[draggedId].x = wx;
        nodes[draggedId].y = wy;
        return;
      }
      if (isPanning) {
        const dx = e.clientX - panStartX, dy = e.clientY - panStartY;
        if (Math.hypot(dx, dy) > 3) pointerMoved = true;
        camX = panCamX - dx / camScale;
        camY = panCamY - dy / camScale;
        return;
      }
      hoverId = e.target === canvas ? hitTest(e.clientX, e.clientY) : -1;
    });

    window.addEventListener("mouseup", (e) => {
      if (draggedId !== -1) {
        if (!pointerMoved) {
          selectedId = draggedId;
          updateInfoCard();
        }
        draggedId = -1;
        canvas.classList.remove("dragging");
      } else if (isPanning) {
        if (!pointerMoved && e.target === canvas) {
          selectedId = -1;
          updateInfoCard();
        }
        isPanning = false;
        canvas.classList.remove("dragging");
      }
    });

    canvas.addEventListener(
      "wheel",
      (e) => {
        e.preventDefault();
        const rect = canvas.getBoundingClientRect();
        const mx = e.clientX - rect.left, my = e.clientY - rect.top;
        const [wx0, wy0] = screenToWorld(mx, my);
        camScale = Math.min(3.0, Math.max(0.2, camScale * (e.deltaY < 0 ? 1.15 : 1 / 1.15)));
        const [wx1, wy1] = screenToWorld(mx, my);
        camX += wx0 - wx1;
        camY += wy0 - wy1;
      },
      { passive: false }
    );

    document.getElementById("bloom-slider").addEventListener("input", (e) => {
      bloomScale = Number(e.target.value) / 100;
    });
    const btnPhys = document.getElementById("btn-physics");
    btnPhys.addEventListener("click", () => {
      physicsRunning = !physicsRunning;
      btnPhys.textContent = physicsRunning ? "⏸ Tạm dừng vật lý" : "▶ Chạy vật lý";
    });
    document.getElementById("btn-reset").addEventListener("click", resetView);
    document.getElementById("btn-zoom-in").addEventListener("click", () => { camScale = Math.min(3.0, camScale * 1.25); });
    document.getElementById("btn-zoom-out").addEventListener("click", () => { camScale = Math.max(0.2, camScale / 1.25); });

    window.addEventListener("resize", resize);
    window.addEventListener("themechange", draw);

    resize();
    resetView();
    requestAnimationFrame(animate);
  </script>
</body>
</html>
